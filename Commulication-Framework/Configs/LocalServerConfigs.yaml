PhotoPath: './Photo'

PreCleanPhoto: False

# Upload subprocess ownership is process-local, so the onboard API uses one
# worker to keep /startUpload and /endUpload on the same process.
Workers: 1

MainUploadPath: "./run_upload.sh"
MainUploadConfig: "./Configs/UploadMainConfig.yaml"
ProcessStartupGraceSeconds: 2.0

StartWithScripts:
  # UAV receives the GV position fallback stream over LoRa.
  - "./Models/CommunicationModels/LoRaModels/LoraReceiver.py"

StartWithScriptsConfigs:
  - "./Configs/CommunicationConfigs/LoRaConfigs/LoraReceiverConfig.yaml"

ShPath: "./RunPySHPath"

LocalUrl: "http://127.0.0.1:26969"

RedisInfo:
  RedisPort: 6379
  RedisIP: "127.0.0.1"
  dbID: 0
