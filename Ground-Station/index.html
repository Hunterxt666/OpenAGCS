<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air-Ground Collaborative Ground Station</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/styles/styles.css">    
</head>
<body>
    <div id="container"></div>
    <div class="time-display" id="timeDisplay"></div>
    <div id="photoPanel" class="panel  collapsed">
        <div class="photo-row" id="realTimePhoto">
          <div class="photo-container">
            <img id="photo0" class="photo" src="assets/no_image.png" alt="UGV Photo">
            <span class="photo-caption">UGV🚗📸</span>
          </div>
          <div class="photo-container">
            <img id="photo1" class="photo" src="assets/no_image.png" alt="UAV Photo">
            <span class="photo-caption">UAV🚁📸</span>
          </div>
        </div>
        <button id="photoButton" class="button-common" onclick="toggleRealtime()">Live View 📹<span id="toggle-icon">&#9650;</span></button>
    </div>
    <div class="data-display collapsed" id="dataDisplay">
        <button class="toggle-btn" onclick="toggleDisplay()">Data Panel 📕<span id="toggle-icon">&#9660;</span>
        </button> <!-- Collapse/expand button -->

        <!-- Agent data side by side -->
        <div class="agents-data">
            <div class="agent" id="agent1">
                <span id="agent1-title">UAV🚁</span>
                <br>
                <span><span class="span_bold">Altitude: </span><span id="agent1-height">-</span> m</span><br>
                <span><span class="span_bold">Yaw: </span><span id="agent1-heading">-</span>°</span><br>
                <span><span class="span_bold">Time: </span><span id="agent1-time">-</span>s</span>
            </div>

            <div class="agent" id="agent2">
                UGV🚗<br>
                <span><span class="span_bold">Altitude: </span><span id="agent2-height">-</span> m</span><br>
                <span><span class="span_bold">Yaw: </span><span id="agent2-heading">-</span>°</span><br>
                <span><span class="span_bold">Time: </span><span id="agent2-time">-</span>s</span>
            </div>
        </div>

        <!-- Shared data area -->
        <div class="public-data">
            <h4>System🖥</h4>
            <span><span class="span_bold">UGV Distance: </span><span id="run_distance">-</span> m</span><br>
            <span><span class="span_bold">UAV-UGV Distance: </span><span id="distance">-</span> m</span><br>
            <span><span class="span_bold">Lead Distance-Height (D-H): </span><span id="D-H">-</span>m</span><br>
            <span><span class="span_bold">Origin Time: </span><span id="origin">-</span></span>
        </div>
    </div>

    <div class="settings-display" id="settingsDisplay">
        
        <div class="settings-content">
            <input type="button" class="btn" value="Refresh Origin ⚓" onclick="init_display()"/>
            <input type="button" class="btn" value="Start Tracking Refresh 🏃" onclick="startTracking()"/>
            <input type="button" class="btn" value="Takeoff 🛫" onclick="setDepart()"/>
            <input type="button" class="btn" value="Land 🛬" onclick="setLand()"/>
            <input type="button" class="btn" value="Pause Tracking Refresh 💺" onclick="stopTracking()"/>
            <input type="button" class="btn btn-close" value="Clear Data ❌"  onclick="stop_display()" "/>
        </div>
        <button class="toggle-btn" onclick="toggleSettingsDisplay()">Ground Station Settings ⚙ <span id="toggle-icon">&#9650;</span>
        </button>
    </div>
    <div class="left-sidebar collapsed" id="leftSidebar">
        <div class="sidebar-content">
            <!-- Threshold section -->
            <div class="input-section">
                <label for="threshold">Origin Distance Threshold (m):</label>
                <input type="text" id="threshold" placeholder="Threshold">
                <button onclick="executeThreshold()">Set</button>
            </div>
            <hr>
            <!-- D-H section -->
            <div class="input-section">
                <label for="d-input">D-H(m):</label>
                <input type="text" id="d-input" placeholder="D value">
                <input type="text" id="h-input" placeholder="H value">
                <button onclick="executeDH()">Set</button>
            </div>
        </div>
        <button class="toggle-btn" onclick="toggleLeftSidebar()">
            Command Settings ✍ <span id="left-toggle-icon">&#9650;</span>
        </button>
    </div>
    <div class="copyright">
        Prof. Zhong Renxin Team, Sun Yat-sen University &copy; 2024
    </div>
    <script src="src/utils/hideBlock.js"></script>  
    <script src="src/utils/fillData.js"></script>
    <script src="src/utils/basicSettings.js"></script>
    <script src="src/utils/orderExecute.js"></script>
    <script src="src/utils/showTime.js"></script>
    <script src="src/utils/api.js"></script>
    <script src="src/utils/map.js"></script>
    <script src="src/main.js"></script>  
</body>
</html>
